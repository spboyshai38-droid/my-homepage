<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Language Guesser</title>
    <style> 
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
            padding: 20px;
        }

        .game-box {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Mode Colors */
        .easy-btn { background-color: #38a169; }
        .easy-btn:hover { background-color: #2f855a; }
        
        .medium-btn { background-color: #dd6b20; }
        .medium-btn:hover { background-color: #c05621; }
        
        .hard-btn { background-color: #e53e3e; }
        .hard-btn:hover { background-color: #c53030; }

        button:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    
    <h1>Welcome to My Arcade Homepage</h1>


    <div style="position: fixed; top: 20%; left: 5%; font-size: 50px; opacity: 0.2; transform: rotate(-15deg); user-select: none;">🗺️ 🧭 🌍</div>
    <div style="position: fixed; top: 25%; right: 5%; font-size: 50px; opacity: 0.2; transform: rotate(15deg); user-select: none;">🗺️ 🧭 🌏</div>
    <div style="position: fixed; bottom: 15%; left: 8%; font-size: 50px; opacity: 0.2; transform: rotate(10deg); user-select: none;">🗺️ 🧭 🌎</div>
    <div style="position: fixed; bottom: 20%; right: 8%; font-size: 50px; opacity: 0.2; transform: rotate(-10deg); user-select: none;">🗺️ 🧭 🌍</div>


    <div class="game-box" style="border-top: 8px solid #3182ce; position: relative; overflow: hidden;">
        <span style="background: #edf2f7; color: #4a5568; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Arcade Edition V2</span>

        <h2 style="color:#2d3748; margin-top: 15px; font-size: 28px;">Select a Game Mode</h2>
        <p style="color:#718096; font-size: 15px; max-width: 400px; margin: 0 auto 25px auto; line-height: 1.5;">
            Choose a challenge tier below to test your audio-visual translation speed. Each mode features entirely unique scripts, regional dialects, and native alphabets.
        </p>
        
        <div style="display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%;">
            
            <a href="easy.html" style="text-decoration: none; display: block; width: 90%;">
                <button class="easy-btn" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; color: white; cursor: pointer; transition: transform 0.2s;" onmouseover="playTone(440, 'sine', 0.05)" onclick="playTone(587.33, 'triangle', 0.15)">
                    <span>🟢 Easy Mode</span>
                    <span style="font-size: 24px;">🎮 📖</span>
                </button>
            </a>

            
            <a href="medium.html" style="text-decoration: none; display: block; width: 90%;">
                <button class="medium-btn" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; color: white; cursor: pointer; transition: transform 0.2s;" onmouseover="playTone(493.88, 'sine', 0.05)" onclick="playTone(659.25, 'triangle', 0.15)">
                    <span>🟠 Medium Mode</span>
                    <span style="font-size: 24px;">🏹 🗺️</span>
                </button>
            </a>

           
            <a href="hard.html" style="text-decoration: none; display: block; width: 90%;">
                <button class="hard-btn" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; color: white; cursor: pointer; transition: transform 0.2s;" onmouseover="playTone(523.25, 'sine', 0.05)" onclick="playTone(783.99, 'triangle', 0.15)">
                    <span>🔴 Hard Mode</span>
                    <span style="font-size: 24px;">👑 🌋</span>
                </button>
            </a>
            
        </div>
    </div>

  
    <script>
        function playTone(frequency, type, duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
    </script>
</body>
</html>
